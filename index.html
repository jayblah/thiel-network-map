<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thiel Network Map</title>
<link rel="stylesheet" href="styles.css">
</head><body>
<header>
 <h1>Peter Thiel's Network <span class="ver" title="Page version">v1.12</span><small>from <i>The Nerd Reich</i> by Gil Duran. Hover a card to trace its links, click for details</small></h1>
 <div class="tools">
  <input type="search" id="q" placeholder="Search a name or company">
  <button id="helpBtn" title="How to Read This Map (?)" aria-label="How to read this map" aria-haspopup="dialog">?</button>
  <button id="legendBtn" title="Show or Hide the Legend (L)">Legend</button>
  <button id="sideBtn" title="Show or Hide the Details Panel (D)">Details Panel</button>
  <button id="theme">Light / Dark</button>
 </div>
</header>
<div class="bar" id="bar">
 <div class="filters" id="filters">
  <button id="legendTab" title="Show or Hide the Legend (L)" aria-label="Toggle legend"><span class="chev">&#9662;</span></button>
  <span>Show:</span>
 </div>
 <div id="legend"></div>
</div>
<main>
 <div id="view"><div id="stage"><svg id="ov"></svg></div></div>
 <div id="tray" aria-hidden="true"></div>
 <button id="sideTab" title="Show or Hide the Details Panel (D)" aria-label="Toggle details panel">&#9656;</button>
 <aside id="side"></aside>
</main>

<template id="howto">
 <h2 id="helpTitle">How to Read This</h2>
 Each card is a person, company or project the book connects to Thiel. Its colour is its category, a <b class="t-red">red dashed border</b> means anti-democracy or exit views, <b class="t-purple">&#10013;</b> marks a Christian tie, and the pills tell you what more is in the detail panel. Cards with a notched shape are network states or startup cities. A round <b>W</b> on a card, and the dotted-underlined names in the text, open Wikipedia articles (only where a matching one exists). The details panel also lists <b>sources cited in the book</b> for key claims, so they can be fact-checked. Everything here is the book's account. The line under each name is how that card relates to Thiel.
</template>

<dialog id="help" aria-labelledby="helpTitle">
 <button id="helpClose" aria-label="Close" title="Close (Esc)">&times;</button>
 <div id="helpBody"></div>
</dialog>

<script src="data.js"></script>
<script src="app.js"></script>
</body></html>
