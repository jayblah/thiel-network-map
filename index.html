<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thiel Network Map</title>
<style>
:root{--bg:#eef0f5;--panel:#ffffff;--ink:#1c2230;--mute:#667085;--line:#d9dde6;--accent:#4f46e5;--red:#e11d1d;--purple:#7c4dff;--green:#16943a;--blue:#2b6bd6;--money:#00a63c;--navy:#1e3a8a;--gold:#a15c00;--slate:#475569;--teal:#0b7a75;color-scheme:light}
:root[data-theme=dark]{--bg:#0f121a;--panel:#181d2b;--ink:#e8ebf3;--mute:#9aa4bb;--line:#2b3350;--accent:#8b86ff;--red:#ff5a5a;--purple:#a58bff;--green:#3ccf68;--blue:#6aa2ff;--money:#39ff7a;--navy:#7aa2ff;--gold:#ffb340;--slate:#aab4c8;--teal:#34d8cf;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f121a;--panel:#181d2b;--ink:#e8ebf3;--mute:#9aa4bb;--line:#2b3350;--accent:#8b86ff;--red:#ff5a5a;--purple:#a58bff;--green:#3ccf68;--blue:#6aa2ff;--money:#39ff7a;--navy:#7aa2ff;--gold:#ffb340;--slate:#aab4c8;--teal:#34d8cf;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
h1{font-size:1.15rem;margin:0}
h1 small{display:block;font-weight:400;color:var(--mute);font-size:.8rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}
input[type=search]{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);width:220px;font:inherit}
button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 18px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:.82rem;color:var(--mute)}
.lg{display:inline-flex;align-items:center;gap:6px}
#legend{flex:1 1 100%;display:flex;flex-direction:column;gap:7px}
.lrow{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.lrow>b{color:var(--ink);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;min-width:74px}
.lg .pill{margin:0}
.sw.notch{border:2px solid var(--mute);border-radius:3px 9px 3px 9px}
.sw{width:15px;height:15px;border-radius:4px;display:inline-block}
.sw.anti{border:3px dashed var(--red)}
.sw.pillsw{height:9px;width:20px;border-radius:99px}
main{flex:1;display:flex;min-height:0;position:relative}
#view{flex:1;overflow:auto;position:relative}
#stage{position:relative;padding:20px;display:grid;gap:18px;grid-template-columns:repeat(12,1fr);max-width:1700px;margin:0 auto}
svg#ov{position:absolute;left:0;top:0;pointer-events:none;z-index:1;overflow:visible}
aside{width:360px;max-width:42vw;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:18px}
@media(max-width:900px){main{flex-direction:column}aside{width:100%;max-width:none;height:38vh;border-left:0;border-top:1px solid var(--line)}#stage{grid-template-columns:1fr!important}.sec-c{grid-column:1/-1!important}}
main.collapsed aside{display:none}
#sideTab{position:absolute;top:14px;right:min(360px,42vw);z-index:6;width:26px;height:64px;padding:0;border-radius:10px 0 0 10px;border-right:0;background:var(--panel);font-size:1.1rem;line-height:1;box-shadow:-2px 2px 8px rgba(0,0,0,.15)}
main.collapsed #sideTab{right:0}
@media(max-width:900px){#sideTab{top:auto;bottom:calc(38vh + 6px);right:12px;width:64px;height:26px;border-radius:10px 10px 0 0;border-right:1px solid var(--line)}main.collapsed #sideTab{bottom:0}}
#tray{position:absolute;left:12px;right:calc(min(360px,42vw) + 12px);z-index:7;pointer-events:none;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(6px);border:2px solid var(--accent);border-radius:14px;padding:10px 12px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transform:translateY(6px);transition:opacity .12s,transform .12s;max-height:62vh;overflow:hidden}
#tray.top{top:10px}#tray.bot{bottom:10px}
#tray.show{opacity:1;transform:none}
main.collapsed #tray{right:12px}
#tray .th{font-size:.78rem;color:var(--mute);margin-bottom:7px}
#tray .th b{color:var(--ink);font-size:.95rem}
#tray .chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
#tray .chip2{border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--panel));border-radius:8px;padding:7px 10px;font-size:.82rem;line-height:1.3}
#tray.compact .chip2 .d{display:none}
#tray .chip2 .sb{display:block;color:var(--mute);font-size:.76rem}
#tray .chip2 .rl{display:block;margin-top:3px;font-weight:600}
#tray .chip2 .d{display:block;margin-top:3px;font-size:.76rem;padding-left:7px;border-left:3px solid}
#tray .chip2 .d.v{border-color:var(--red)}#tray .chip2 .d.f{border-color:var(--purple)}#tray .chip2 .d.m{border-color:var(--green)}#tray .chip2 .d.c{border-color:var(--blue)}
#tray .chip2 .d em{font-style:normal;font-weight:700;margin-right:4px}
#tray .chip2 .d.v em{color:var(--red)}#tray .chip2 .d.f em{color:var(--purple)}#tray .chip2 .d.m em{color:var(--green)}#tray .chip2 .d.c em{color:var(--blue)}
#tray .chip2 b{display:block;font-size:.88rem}
#tray .chip2 span{color:var(--mute)}
#tray .chip2 i{font-style:normal;float:right;margin-left:6px;font-size:.7rem;font-weight:700;color:var(--accent)}
@media(max-width:900px){#tray{right:12px}#tray.bot{bottom:calc(38vh + 10px)}main.collapsed #tray.bot{bottom:10px}}
aside h2{margin:0 0 4px;font-size:1.25rem}
.cat{display:inline-block;font-size:.74rem;padding:2px 10px;border-radius:999px;margin-bottom:8px;color:#fff;font-weight:600}
.dsec{margin:14px 0;padding-left:10px;border-left:4px solid}
.dsec .h{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:2px}
.dsec.v{border-color:var(--red)}.dsec.v .h{color:var(--red)}
.dsec.f{border-color:var(--purple)}.dsec.f .h{color:var(--purple)}
.dsec.m{border-color:var(--green)}.dsec.m .h{color:var(--green)}
.dsec.c{border-color:var(--blue)}.dsec.c .h{color:var(--blue)}
.con{display:block;width:100%;text-align:left;border-radius:10px;margin:4px 0;padding:7px 10px}
.con>span{color:var(--mute);display:block;font-size:.82rem}
.hint{color:var(--mute)}
/* sections */
.sec{border-radius:16px;padding:12px 14px 16px;background:color-mix(in srgb,var(--c) 9%,var(--panel));border:2px solid color-mix(in srgb,var(--c) 45%,transparent)}
.sec h3{margin:0 0 10px;font-size:.9rem;letter-spacing:.05em;text-transform:uppercase;color:var(--c);display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.card{position:relative;z-index:2;background:color-mix(in srgb,var(--c) 20%,var(--panel));border:2px solid var(--c);border-radius:12px;padding:9px 11px 8px;cursor:pointer;transition:opacity .15s,transform .12s,box-shadow .15s;color:var(--ink)}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.card .n{font-weight:700;font-size:1rem;line-height:1.2}
.card .s{font-size:.8rem;color:var(--mute);margin-top:1px}
.card .r{font-size:.8rem;margin-top:5px;padding-top:5px;border-top:1px dashed color-mix(in srgb,var(--c) 55%,transparent)}
.card.anti{border:3px dashed var(--red);padding:8px 10px 7px}
.card.faith::after{content:"\271D";position:absolute;right:8px;top:6px;color:var(--purple);font-size:1.05rem;font-weight:700}
.card.net{border-radius:4px 22px 4px 22px}
.card.sel{outline:4px solid var(--accent);outline-offset:2px}
.card.hero{background:linear-gradient(135deg,#1d2433,#2f3a58);color:#fff;border-color:#000;border-radius:16px;cursor:pointer}
.card.hero .s,.card.hero .r{color:#cfd6ea}
.wp{position:absolute;right:7px;bottom:6px;width:20px;height:20px;border-radius:50%;background:var(--panel);color:var(--ink);border:1.5px solid var(--c);font:700 11px/17px Georgia,serif;text-align:center;text-decoration:none;opacity:.85}
.wp:hover{background:var(--c);color:#fff;opacity:1}
.card .pills{padding-right:24px}
.wl{display:inline-block;margin:6px 0;padding:4px 12px;border-radius:99px;border:1.5px solid var(--accent);color:var(--accent);text-decoration:none;font-weight:600;font-size:.85rem}
.wl:hover{background:var(--accent);color:#fff}
.pills{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:.68rem;line-height:1;padding:3px 7px;border-radius:99px;color:#fff;font-weight:700}
.pill.v{background:#d92020}.pill.f{background:#7c4dff}.pill.m{background:#16943a}.pill.c{background:#2b6bd6}
.money{color:var(--money);font-weight:800;letter-spacing:.01em}
:root[data-theme=dark] .money{text-shadow:0 0 8px rgba(57,255,122,.35)}
.pill.g1{background:#1e3a8a}.pill.g2{background:#a15c00}.pill.g3{background:#475569}.pill.g4{background:#0b7a75}
.dsec.g{border-color:var(--navy)}.dsec.g .h{color:var(--navy)}
#tray .chip2 .d.g{border-color:var(--navy)}#tray .chip2 .d.g em{color:var(--navy)}
.reach{grid-column:1/-1;border-radius:16px;border:2px solid var(--navy);background:color-mix(in srgb,var(--navy) 9%,var(--panel));padding:12px 16px}
.reach h3{margin:0 0 8px;font-size:.9rem;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.reach .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.rb{display:inline-flex;align-items:baseline;gap:6px;border:2px solid;border-radius:12px;padding:5px 12px;cursor:pointer;background:var(--panel);color:var(--ink);font:inherit}
.rb b{font-size:1.35rem;line-height:1}
.rb.k1{border-color:#1e3a8a}.rb.k1 b{color:var(--navy)}.rb.k2{border-color:#a15c00}.rb.k2 b{color:var(--gold)}.rb.k3{border-color:#475569}.rb.k3 b{color:var(--slate)}.rb.k4{border-color:#0b7a75}.rb.k4 b{color:var(--teal)}
.reach .facts{margin-top:9px;font-size:.88rem}
.reach .facts span{display:inline-block;margin:2px 14px 2px 0}
.ver{display:inline-block;margin-left:8px;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent);color:#fff;vertical-align:middle}
.pill.b1{background:#8b1a1a}.pill.b2{background:#a3176b}.pill.b3{background:#5f6b00}
.pill.b1,.pill.b2,.pill.b3{box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
.dsec.b{border-color:#b91c1c;background:color-mix(in srgb,#b91c1c 8%,transparent);padding-top:6px;padding-bottom:6px;border-radius:0 8px 8px 0}.dsec.b .h{color:#b91c1c}
:root[data-theme=dark] .dsec.b .h{color:#ff8a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .dsec.b .h{color:#ff8a8a}}
#tray .chip2 .d.b{border-color:#b91c1c}#tray .chip2 .d.b em{color:#b91c1c}
.flags{grid-column:1/-1;border-radius:16px;border:2px dashed #b91c1c;background:color-mix(in srgb,#b91c1c 7%,var(--panel));padding:12px 16px}
.flags h3{margin:0 0 6px;font-size:.9rem;letter-spacing:.05em;text-transform:uppercase;color:#b91c1c}
:root[data-theme=dark] .flags h3{color:#ff8a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .flags h3{color:#ff8a8a}}
.flags .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.flags .note{margin-top:8px;font-size:.8rem;color:var(--mute)}
.fb{display:inline-flex;align-items:baseline;gap:6px;border:2px solid;border-radius:12px;padding:5px 12px;cursor:pointer;background:var(--panel);color:var(--ink);font:inherit}
.fb b{font-size:1.35rem;line-height:1}
.fb.f1{border-color:#8b1a1a}.fb.f2{border-color:#a3176b}.fb.f3{border-color:#8a9a00}
.wk{color:inherit;text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--accent)}
.wk:hover{color:var(--accent);text-decoration-style:solid}
#tray .wk{text-decoration:none}
.srcl{display:block;margin:4px 0;padding:5px 9px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;color:var(--ink);text-decoration:none;font-size:.82rem;line-height:1.3}
.srcl:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.srcl i{font-style:normal;display:inline-block;font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:99px;margin-left:6px;color:#fff;background:var(--green);vertical-align:1px}
.srcl i.bl{background:var(--slate)}
.dim{opacity:.18!important}
.hero-wrap{grid-column:1/-1;display:grid;grid-template-columns:minmax(280px,1fr) 2fr;gap:14px;align-items:stretch}
.hero-note{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px;color:var(--mute);font-size:.86rem}
.hero-note b{color:var(--ink)}
@media(max-width:900px){.hero-wrap{grid-template-columns:1fr}}
.lbl .money{fill:var(--money);font-weight:800}
.lbl{font-size:11px;font-weight:600;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}

const COLS={infl:'#3b6fc9',pp:'#2e9d44',neo:'#e0780b',pol:'#d6246e',prot:'#0f9d94',oth:'#7b8394',net:'#c79a0a',faith:'#7c4dff',center:'#1d2433'};
const ORDER=[['infl',6],['pp',6],['neo',12],['pol',12],['prot',12],['faith',6],['net',12],['oth',6]];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const MONEY=/\$\d[\d,]*(?:\.\d+)?(?:\s?(?:billion|million|thousand)|[KMB])?\+?/g;
const ENT=DATA.ent||{};
const ENTRE=new RegExp('(?<![A-Za-z0-9])('+Object.keys(ENT).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![A-Za-z0-9])','g');
const link=s=>s.replace(ENTRE,m=>`<a class="wk" href="${ENT[m]}" target="_blank" rel="noopener" title="Wikipedia: ${m}">${m}</a>`);
const fmt=s=>link(esc(s)).replace(MONEY,m=>`<span class="money">${m}</span>`);
const mny=s=>esc(s).replace(MONEY,m=>`<span class="money">${m}</span>`);
const svgm=s=>esc(s).replace(MONEY,m=>`<tspan class="money">${m}</tspan>`);
const GK={contractor:['g1','gov contractor','Government contractor'],official:['g2','&#9733; in government','Holds or held a government role'],influence:['g3','gov influence','Investor or lobbyist with government reach'],abroad:['g4','abroad','Dealings with non-US governments']};
// legend
$('#legend').innerHTML=
 '<div class="lrow"><b>Box colour</b>'+ORDER.map(([k])=>`<span class="lg"><i class="sw" style="background:${COLS[k]}"></i>${CAT[k]}</span>`).join('')+'</div>'+
 '<div class="lrow"><b>Badges</b>'+
 '<span class="lg"><span class="pill v">views</span>anti-democracy / exit views</span>'+
 '<span class="lg"><span class="pill f">&#10013; faith</span>Christian tie</span>'+
 '<span class="lg"><span class="pill m">$ funding</span>Thiel funding</span>'+
 '<span class="lg"><span class="pill c">companies</span>companies listed</span>'+
 Object.entries(GK).map(([k,v])=>`<span class="lg"><span class="pill ${v[0]}">${v[1]}</span>${v[2]}</span>`).join('')+
 '<span class="lg"><span class="pill b1">&#9888; white supremacist association</span>Documented speeches, writings or statements</span>'+
 '</div>'+
 '<div class="lrow"><b>Marks</b>'+
 '<span class="lg"><i class="sw anti"></i>red dashed border: anti-democracy views</span>'+
 '<span class="lg"><i class="sw notch"></i>notched card: network state or startup city</span>'+
 '<span class="lg"><b style="color:var(--purple)">&#10013;</b>Christian tie (card corner)</span>'+
 '<span class="lg"><a class="wp" style="position:static;display:inline-block;pointer-events:none" href="#">W</a>Wikipedia article for the card</span>'+
 '<span class="lg"><span class="wk">underlined</span>Wikipedia link for a name in the text</span>'+
 '<span class="lg"><span class="money">$15M</span>money amount</span>'+
 '</div>';
// relationship to Thiel text
const rel={};E.forEach(e=>{if(e.a==='T'&&!rel[e.b])rel[e.b]=e.label;if(e.b==='T'&&!rel[e.a])rel[e.a]=e.label});
const stage=$('#stage');
function pills(n){let p='';if(n.anti||n.views)p+='<span class="pill v">views</span>';if(n.faith)p+='<span class="pill f">&#10013; faith</span>';if(n.fund)p+='<span class="pill m">$ funding</span>';if(n.cos&&n.cat!=='net')p+='<span class="pill c">companies</span>';if(n.gov)n.gov.kinds.forEach(k=>p+=`<span class="pill ${GK[k][0]}">${GK[k][1]}</span>`);if(n.assoc)p+=`<span class="pill b1">&#9888; white supremacist association</span>`;return p?`<div class="pills">${p}</div>`:''}
function extraTxt(n){return n.id==='T'?`<div class="r">${fmt(n.cos)}</div><div class="r">${fmt(n.faith)}</div>`:''}
function card(n,extra=''){return `<div class="card ${n.anti?'anti':''} ${n.faith?'faith':''} ${n.cat==='net'?'net':''} ${extra}" data-id="${n.id}" style="--c:${COLS[n.cat]}"><div class="n">${esc(n.name)}</div>${n.sub.length?`<div class="s">${fmt(n.sub.join(' · '))}</div>`:''}${rel[n.id]&&n.id!=='T'?`<div class="r">${fmt(rel[n.id])}</div>`:''}${extraTxt(n)}${pills(n)}${n.wiki?`<a class="wp" href="${n.wiki}" target="_blank" rel="noopener" title="Open Wikipedia article">W</a>`:''}</div>`}
const T=N.T;
let html=`<div class="hero-wrap">${card(T,'hero')}<div class="hero-note"><b>How to read this.</b> Each card is a person, company or project the book connects to Thiel. Its colour is its category, a <b style="color:var(--red)">red dashed border</b> means anti-democracy or exit views, <b style="color:var(--purple)">&#10013;</b> marks a Christian tie, and the pills tell you what more is in the detail panel. Cards with a notched shape are network states or startup cities. A round <b>W</b> on a card, and the dotted-underlined names in the text, open Wikipedia articles (only where a matching one exists). The details panel also lists <b>sources cited in the book</b> for key claims, so they can be fact-checked. Everything here is the book's account. The line under each name is how that card relates to Thiel.</div></div>`;
const cnt=k=>Object.values(N).filter(n=>n.gov&&n.gov.kinds.includes(k)).length;
html+=`<section class="reach"><h3>Reach into government</h3><div class="row">${[['official','k2','in government'],['contractor','k1','government contractors'],['influence','k3','with government influence'],['abroad','k4','dealing with other governments']].map(([k,c,l])=>`<button class="rb ${c}" data-gf="gov:${k}"><b>${cnt(k)}</b>${l}</button>`).join('')}</div><div class="facts"><span><b class="money">$2.5B</b> in federal contracts to Palantir since 2009</span><span><b>16</b> longtime Thiel associates in Trump administration posts (Bloomberg)</span><span>Up to <b class="money">$10B</b> Army contract consolidation planned for Palantir</span><span>Countries: <b>United States &middot; Israel &middot; Honduras &middot; Denmark/Greenland</b></span></div></section>`;
html+=`<section class="flags"><h3>&#9888; White supremacist associations</h3><div class="row"><button class="fb f1" data-gf="flag"><b>${Object.values(N).filter(n=>n.assoc).length}</b>people with documented associations</button></div><div class="note">Listed only where <i>The Nerd Reich</i> points to specific speeches, writings or statements. These are the book's characterizations, not independent findings, and some people named have disputed them.</div></section>`;
const SPAN={infl:5,pp:7,neo:12,pol:12,prot:12,faith:12,net:12,oth:12};
ORDER.forEach(([k])=>{const ns=Object.values(N).filter(n=>n.cat===k);if(!ns.length)return;
 html+=`<section class="sec sec-c" style="--c:${COLS[k]};grid-column:span ${SPAN[k]}"><h3>${CAT[k]}</h3><div class="grid">${ns.map(n=>card(n)).join('')}</div></section>`});
stage.insertAdjacentHTML('afterbegin',html);
const els={};$$('.card').forEach(c=>els[c.dataset.id]=c);
const ov=$('#ov');
function relBox(el){const a=el.getBoundingClientRect(),b=stage.getBoundingClientRect();return{x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height}}
function draw(id,withLabels){
 const b=stage.getBoundingClientRect();ov.setAttribute('width',stage.scrollWidth);ov.setAttribute('height',stage.scrollHeight);
 const cons=E.filter(e=>e.a===id||e.b===id);let s='';
 const defs={};
 cons.forEach((e,i)=>{const o=e.a===id?e.b:e.a;if(!els[o])return;
  const A=relBox(els[e.a]),B=relBox(els[e.b]);
  const ca=[A.x+A.w/2,A.y+A.h/2],cb=[B.x+B.w/2,B.y+B.h/2];
  const col=COLS[N[e.a].cat]||'#555';
  const sw={strong:4,normal:2.5,weak:2,plain:2}[e.kind];
  const dash=e.kind==='weak'?'2 6':'none';
  const dx=cb[0]-ca[0],dy=cb[1]-ca[1];const mx=(ca[0]+cb[0])/2,my=(ca[1]+cb[1])/2;
  const bend=Math.min(120,Math.hypot(dx,dy)*.25);const nx=-dy/(Math.hypot(dx,dy)||1),ny=dx/(Math.hypot(dx,dy)||1);
  const cx=mx+nx*bend*((i%2)?1:-1),cy=my+ny*bend*((i%2)?1:-1);
  const mk=e.kind==='plain'?'':`marker-end="url(#ah${e.a})"`;
  defs[e.a]=col;
  s+=`<path d="M${ca[0]},${ca[1]} Q${cx},${cy} ${cb[0]},${cb[1]}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${dash}" opacity=".85" ${mk}/>`;
  if(withLabels&&e.label){const tx=.25*ca[0]+.5*cx+.25*cb[0],ty=.25*ca[1]+.5*cy+.25*cb[1];const t=e.label.length>46?e.label.slice(0,44)+'…':e.label;s+=`<text class="lbl" x="${tx}" y="${ty}" text-anchor="middle" fill="${col}">${svgm(t)}</text>`}});
 const d=Object.entries(defs).map(([k,c])=>`<marker id="ah${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('');
 ov.innerHTML=`<defs>${d}</defs>${s}`}
const clearLines=()=>{ov.innerHTML=''};
function setDim(show){Object.entries(els).forEach(([id,e])=>e.classList.toggle('dim',!!show&&!show.has(id)))}
let pinned=null,filt='all',term='';
function neigh(id){const s=new Set([id]);E.forEach(e=>{if(e.a===id)s.add(e.b);if(e.b===id)s.add(e.a)});return s}
function focus(id,pin){setDim(neigh(id));draw(id,pin&&id!=='T')}
function reset(){clearLines();applyFilter()}
const tray=$('#tray');let trayT=null;
function hideTray(){clearTimeout(trayT);tray.classList.remove('show');tray.setAttribute('aria-hidden','true')}
function showTray(id){clearTimeout(trayT);trayT=setTimeout(()=>{
 const cons=E.filter(e=>e.a===id||e.b===id);if(!cons.length)return;
 const vr=$('#view').getBoundingClientRect(),cr=els[id].getBoundingClientRect();
 const pos=r=>r.bottom<vr.top+8?'up':(r.top>vr.bottom-8?'down':'');
 const items=cons.map(e=>{const o=e.a===id?e.b:e.a;return{o,e,p:els[o]?pos(els[o].getBoundingClientRect()):''}}).sort((x,y)=>(!!y.p)-(!!x.p));
 const cap=id==='T'?12:16,shown=items.slice(0,cap);
 const cut=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
 const det=n=>(n.views?`<span class="d v"><em>Views</em>${fmt(cut(n.views,110))}</span>`:'')+(n.faith?`<span class="d f"><em>&#10013; Faith</em>${fmt(cut(n.faith,110))}</span>`:'')+(n.fund?`<span class="d m"><em>Thiel $</em>${fmt(cut(n.fund,110))}</span>`:'')+(n.cos&&n.cat!=='net'?`<span class="d c"><em>Companies</em>${fmt(cut(n.cos,90))}</span>`:'')+(n.gov?`<span class="d g"><em>Gov</em>${fmt(cut(n.gov.text,120))}</span>`:'')+(n.assoc?`<span class="d b"><em>&#9888; Flagged</em>white supremacist association (see details)</span>`:'');
 tray.innerHTML=`<div class="th">Connected to <b>${esc(N[id].name)}</b> &middot; ${cons.length}${items.filter(i=>i.p).length?` &middot; ${items.filter(i=>i.p).length} off-screen shown first`:''}</div><div class="chips">`+shown.map(i=>`<div class="chip2" style="--c:${COLS[N[i.o].cat]}">${i.p?`<i>${i.p==='up'?'&uarr; above':'&darr; below'}</i>`:''}<b>${esc(N[i.o].name)}</b>${N[i.o].sub.length?`<span class="sb">${fmt(N[i.o].sub.join(' · '))}</span>`:''}<span class="rl">${i.e.kind==='plain'?'&harr;':(i.e.a===id?'&rarr;':'&larr;')} ${fmt(i.e.label||'connected')}</span>${det(N[i.o])}</div>`).join('')+(items.length>cap?`<div class="chip2"><span>+${items.length-cap} more (click the card to see all in the side panel)</span></div>`:'')+'</div>';
 tray.style.maxHeight='';tray.classList.remove('compact');const th=tray.offsetHeight+24;const roomTop=cr.top-vr.top,roomBot=vr.bottom-cr.bottom;const top=roomTop>=th?(roomBot>=th?roomTop<=roomBot:true):(roomBot>=th?false:roomTop>roomBot);tray.classList.toggle('top',top);tray.classList.toggle('bot',!top);const room=(top?roomTop:roomBot)-20;if(th-24>room){tray.classList.add('compact');if(tray.offsetHeight>room)tray.style.maxHeight=Math.max(110,room)+'px'}else tray.classList.remove('compact');
 tray.classList.add('show');tray.setAttribute('aria-hidden','false')},140)}
document.addEventListener('mouseover',e=>{const c=e.target.closest('.card');if(c&&!pinned){focus(c.dataset.id,false);showTray(c.dataset.id)}});
document.addEventListener('mouseout',e=>{const c=e.target.closest('.card');if(c&&!pinned){reset();hideTray()}});
function unpin(){pinned=null;$$('.card.sel').forEach(x=>x.classList.remove('sel'))}
function pin(id){hideTray();if(!sideOpen())setSide(true,true);unpin();pinned=id;els[id].classList.add('sel');focus(id,true);show(id)}
document.addEventListener('click',e=>{if(e.target.closest('a.wp,a.wl,a.wk,a.srcl'))return;const c=e.target.closest('.card');if(c){pin(c.dataset.id);return}
 if(e.target.closest('aside,header,.bar'))return;if(pinned){unpin();reset()}});
function show(id){const n=N[id];
 let h=`<h2>${esc(n.name)}</h2><span class="cat" style="background:${COLS[n.cat]}">${CAT[n.cat]||''}</span>`;
 if(n.sub.length)h+=`<div class="hint">${fmt(n.sub.join(' · '))}</div>`;
 if(n.wiki)h+=`<a class="wl" href="${n.wiki}" target="_blank" rel="noopener">Wikipedia article &#8599;</a>`;
 if(rel[id]&&id!=='T')h+=`<p><b>Link to Thiel:</b> ${fmt(rel[id])}</p>`;
 if(n.anti)h+=`<div class="dsec v"><span class="h">Anti-democracy / exit views</span>${fmt(n.views||'Flagged in the book as echoing these views')}</div>`;else if(n.views)h+=`<div class="dsec v"><span class="h">Views</span>${fmt(n.views)}</div>`;
 if(n.faith)h+=`<div class="dsec f"><span class="h">&#10013; Christian association</span>${fmt(n.faith)}</div>`;
 if(n.fund)h+=`<div class="dsec m"><span class="h">Thiel funding</span>${fmt(n.fund)}</div>`;
 if(n.cos)h+=`<div class="dsec c"><span class="h">Companies / projects</span>${fmt(n.cos)}</div>`;
 if(n.assoc)h+=`<div class="dsec b"><span class="h">Associations noted in the book</span><div style="margin-top:4px">${fmt(n.assoc)}</div></div>`;
 if(n.gov)h+=`<div class="dsec g"><span class="h">Government reach</span><div>${n.gov.kinds.map(k=>`<span class="pill ${GK[k][0]}" title="${GK[k][2]}">${GK[k][1]}</span>`).join(' ')}</div><div style="margin-top:4px">${fmt(n.gov.text)}</div></div>`;
 if(n.sources&&n.sources.length)h+=`<div class="dsec" style="border-color:var(--accent)"><span class="h" style="color:var(--accent)">Sources cited in the book (to fact-check)</span>${n.sources.map(s=>`<a class="srcl" href="${s.u}" target="_blank" rel="noopener">${mny(s.l)}<i class="${s.s==='ok'?'':'bl'}">${s.s==='ok'?'opens':'may be paywalled'}</i></a>`).join('')}<div class="hint" style="font-size:.76rem;margin-top:4px">Addresses are exactly as cited in the book's endnotes. Every one was checked to exist; some publishers block automated access, so a few may ask you to log in.</div></div>`;
 const cons=E.filter(e=>e.a===id||e.b===id);
 h+=`<div class="dsec" style="border-color:var(--line)"><span class="h" style="color:var(--mute)">Connections (${cons.length})</span>`+cons.map(e=>{const o=e.a===id?e.b:e.a;const ar=e.kind==='plain'?'&harr;':(e.a===id?'&rarr;':'&larr;');return `<button class="con" data-go="${o}" style="border-left:5px solid ${COLS[N[o].cat]}">${ar} <b>${esc(N[o].name)}</b><span>${fmt(e.label||'')}</span></button>`}).join('')+'</div>';
 $('#side').innerHTML=h;$('#side').scrollTop=0;
 $$('#side .con').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const g=b.dataset.go;pin(g);els[g].scrollIntoView({block:'center',behavior:'smooth'})})}
const test={flag:n=>n.assoc,gov:n=>n.gov,'gov:contractor':n=>n.gov&&n.gov.kinds.includes('contractor'),'gov:official':n=>n.gov&&n.gov.kinds.includes('official'),'gov:influence':n=>n.gov&&n.gov.kinds.includes('influence'),'gov:abroad':n=>n.gov&&n.gov.kinds.includes('abroad'),all:()=>true,anti:n=>n.anti,faith:n=>n.faith||n.cat==='faith',fund:n=>n.fund,net:n=>n.cat==='net'};
function applyFilter(){if(pinned)return;const t=term.trim().toLowerCase();
 if(filt==='all'&&!t){setDim(null);return}
 setDim(new Set(Object.values(N).filter(n=>test[filt](n)&&(!t||(n.name+' '+n.cos+' '+n.views+' '+n.faith+' '+n.fund+' '+n.sub.join(' ')+' '+(rel[n.id]||'')).toLowerCase().includes(t))).map(n=>n.id)))}
document.addEventListener('click',e=>{const g=e.target.closest('[data-gf]');if(!g)return;filt=g.dataset.gf;$$('#bar .chip').forEach(x=>x.classList.remove('on'));unpin();clearLines();applyFilter();});
$$('#bar .chip').forEach(c=>c.onclick=()=>{filt=c.dataset.f;$$('#bar .chip').forEach(x=>x.classList.toggle('on',x===c));unpin();clearLines();applyFilter()});
$('#q').oninput=e=>{term=e.target.value;unpin();clearLines();applyFilter()};
$('#theme').onclick=()=>{const r=document.documentElement;const d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
const mainEl=$('main');
function setSide(open,keep){mainEl.classList.toggle('collapsed',!open);$('#sideTab').innerHTML=open?'&#9656;':'&#9666;';$('#sideBtn').setAttribute('aria-pressed',open);
 if(!keep){try{localStorage.setItem('thielSide',open?'1':'0')}catch(e){}}
 if(pinned)draw(pinned,pinned!=='T')}
const sideOpen=()=>!mainEl.classList.contains('collapsed');
$('#sideTab').onclick=$('#sideBtn').onclick=()=>setSide(!sideOpen());
addEventListener('keydown',e=>{if(e.key==='d'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))setSide(!sideOpen())});
try{if(localStorage.getItem('thielSide')==='0')setSide(false,true);else setSide(true,true)}catch(e){setSide(true,true)}
addEventListener('resize',()=>{if(pinned)draw(pinned,pinned!=='T')});
$('#view').addEventListener('scroll',()=>{});
$('#side').innerHTML='<h2>Details</h2><p class="hint">Hover any card to trace its links through the map. Click one to pin it and read its companies, Thiel funding, views, Christian associations and every connection. Click the background to clear. Use the filters above to spotlight anti-democracy views, Christian ties, Thiel funding or network states.</p>';
</script></body></html>
